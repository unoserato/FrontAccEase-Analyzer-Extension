<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FrontAccEase Aria Analyzer</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <header class="main-header">
        <div class="header-left">
          <img
            src="favicon.ico"
            alt="Logo"
            onerror="this.style.display = 'none'"
          />
          <h1>FrontAccEase Aria Analyzer</h1>
        </div>
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle-btn"
          title="Switch to light theme"
          aria-label="Switch to light theme"
        >
          <svg
            class="lucide lucide-moon theme-icon icon-moon"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
          <svg
            class="lucide lucide-sun theme-icon icon-sun"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
            />
          </svg>
        </button>
      </header>

      <main>
        <section class="popup-intro" aria-labelledby="popup-title">
          <h2 id="popup-title">Check this page for accessibility barriers.</h2>
          <p>
            Enter the scan code from your FrontAccEase workspace, then choose an
            analysis depth.
          </p>
        </section>
        <div id="loader" class="loader-container">
          <div class="spinner"></div>
          <span id="loader-text" class="loader-text"
            >Fetching DOM structure...</span
          >
        </div>

        <div
          id="results-wrapper"
          class="results-wrapper"
          data-state="idle"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        >
          <p id="results-title" class="results-title">Ready to scan</p>
          <p id="results-html" class="results">Your report will appear here after you start a scan.</p>
        </div>

        <div class="scan-actions" aria-label="Choose scan type">
          <button type="button" class="analyze-btn" data-scan-type="fast">
            <span
              ><strong>Fast Scan</strong><small>Quick WCAG check</small></span
            >
            <svg
              class="lucide lucide-arrow-right button-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
          <button
            type="button"
            class="analyze-btn llm-btn"
            data-scan-type="llm"
          >
            <span
              ><strong>AI Analysis</strong
              ><small>Detailed remediation</small></span
            >
            <svg
              class="lucide lucide-arrow-right button-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" />
            </svg>
          </button>
        </div>
        <label class="scan-code" for="scan-code-input">
          Scan code:
          <input
            id="scan-code-input"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]{6}"
            placeholder="123456"
            aria-describedby="scan-code-help"
          />
        </label>
        <span id="scan-code-help" class="scan-code"
          >Enter the code shown in FrontAccEase.</span
        >
      </main>
    </div>
    <!-- JRU Technovations, y U here? Do not edit -->
    <script src="popup.js"></script>
  </body>
</html>
